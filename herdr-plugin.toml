id = "herdr-team"
name = "Herdr Team"
version = "0.1.0"
min_herdr_version = "0.9.3"
description = "Initialize configurable team templates and start a Markdown-defined team coordinated by a leader agent."
platforms = ["macos", "linux"]

[[build]]
command = ["go", "build", "-o", "bin/herdr-team", "."]

[[actions]]
id = "start-team"
title = "Start project Herdr Team"
contexts = ["workspace"]
command = ["bin/herdr-team"]

[[actions]]
id = "init-team"
title = "Initialize project Herdr Team"
contexts = ["workspace"]
command = ["bin/herdr-team", "--init"]

[[actions]]
id = "list-templates"
title = "List Herdr Team templates"
contexts = ["workspace"]
command = ["bin/herdr-team", "--list-templates"]

[[actions]]
id = "init-fullstack"
title = "Initialize project fullstack Herdr Team"
contexts = ["workspace"]
command = ["bin/herdr-team", "--init", "--template", "fullstack"]

[[actions]]
id = "check-team"
title = "Check project Herdr Team configuration"
contexts = ["workspace"]
command = ["bin/herdr-team", "--check"]

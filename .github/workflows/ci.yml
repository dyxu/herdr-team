name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Typecheck
        run: npm run check
      - name: Test and build
        run: npm test
      - name: Check built-in templates
        run: |
          project="$(mktemp -d)"
          trap 'rm -rf "$project"' EXIT
          bin/herdr-team templates
          for template in minimal router-worker; do
            mkdir "$project/$template"
            bin/herdr-team init "$project/$template" "$template"
            bin/herdr-team check "$project/$template"
          done

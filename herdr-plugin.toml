id = "herdr-team"
name = "Herdr Team"
version = "0.1.0"
min_herdr_version = "0.9.3"
description = "Initialize configurable team templates and start a Markdown-defined team coordinated by a leader agent."
platforms = ["macos", "linux"]

[[build]]
command = ["npm", "ci", "--include=dev"]

[[build]]
command = ["npm", "run", "build"]

[[actions]]
id = "start-team"
title = "Start project Herdr Team"
contexts = ["workspace"]
command = ["bin/herdr-team", "start"]

[[actions]]
id = "init-team"
title = "Initialize project Herdr Team"
contexts = ["workspace"]
command = ["bin/herdr-team", "init"]

[[actions]]
id = "list-templates"
title = "List Herdr Team templates"
contexts = ["workspace"]
command = ["bin/herdr-team", "templates"]

[[actions]]
id = "init-fullstack"
title = "Initialize project fullstack Herdr Team"
contexts = ["workspace"]
command = ["bin/herdr-team", "init", "", "fullstack"]

[[actions]]
id = "check-team"
title = "Check project Herdr Team configuration"
contexts = ["workspace"]
command = ["bin/herdr-team", "check"]

[[actions]]
id = "status-team"
title = "Show project Herdr Team status"
contexts = ["workspace"]
command = ["bin/herdr-team", "status"]
